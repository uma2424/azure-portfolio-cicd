
name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify portfolio HTML
        run: |
          test -f myportfolio/index.html
          echo "Portfolio HTML file exists"

      - name: Verify profile image
        run: |
          test -f myportfolio/uma.jpeg
          echo "Profile image exists"

      - name: Verify resume
        run: |
          test -f myportfolio/Resume.pdf
          echo "Resume file exists"
