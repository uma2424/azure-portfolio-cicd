
name: Portfolio CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify portfolio HTML
        run: test -f myportfolio/index.html

      - name: Verify profile image
        run: test -f myportfolio/uma.jpeg

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      
      - name: Diagnose SSH connectivity
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          echo "Checking SSH connectivity to VM..."
          getent hosts "$VM_HOST" || true
          timeout 10 bash -c \
            'cat < /dev/null > /dev/tcp/$1/22' _ "$VM_HOST"


      - name: Deploy website
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            myportfolio/ \
            "${VM_USER}@${VM_HOST}:/var/www/html/"

      - name: Check Nginx
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${VM_USER}@${VM_HOST}" \
            "sudo nginx -t"
