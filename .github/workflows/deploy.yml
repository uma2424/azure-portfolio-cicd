name: Portfolio CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION
  # ==========================================
  validate:
    name: CI - Validate Portfolio
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Validate HTML file
      - name: Verify Portfolio HTML
        run: |
          if [ -f myportfolio/index.html ]; then
            echo "SUCCESS: index.html exists"
          else
            echo "ERROR: index.html not found"
            exit 1
          fi

      # Step 3: Validate CSS file
      - name: Verify CSS File
        run: |
          if [ -f myportfolio/style.css ]; then
            echo "SUCCESS: style.css exists"
          else
            echo "WARNING: style.css not found"
          fi

      # Step 4: Validate JavaScript file
      - name: Verify JavaScript File
        run: |
          if [ -f myportfolio/script.js ]; then
            echo "SUCCESS: script.js exists"
          else
            echo "WARNING: script.js not found"
          fi

      # Step 5: Validate profile image
      - name: Verify Profile Image
        run: |
          if [ -f myportfolio/uma.jpeg ]; then
            echo "SUCCESS: Profile image exists"
          else
            echo "ERROR: uma.jpeg not found"
            exit 1
          fi

      # Step 6: Check resume
      - name: Verify Resume
        run: |
          if [ -f myportfolio/Resume.pdf ]; then
            echo "SUCCESS: Resume found"
          else
            echo "WARNING: Resume.pdf not found"
          fi

      # Step 7: CI completion
      - name: CI Validation Completed
        run: echo "Portfolio validation completed successfully"

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT
  # ==========================================
 
name: Portfolio CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify portfolio HTML
        run: test -f myportfolio/index.html

      - name: Verify profile image
        run: test -f myportfolio/uma.jpeg

  deploy:
    name: Deploy to Azure VM
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      - name: Setup SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
          echo "SSH private key format is valid"

      - name: Test VM network connectivity
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -eu
          test -n "$VM_HOST"
          echo "Checking SSH port on Azure VM"
          timeout 15 bash -c \
            'exec 3<>/dev/tcp/$1/22' _ "$VM_HOST"
          echo "SSH port 22 is reachable"

      - name: Add VM host key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -eu
          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "$VM_HOST" \
            >> "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH authentication
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${VM_USER}@${VM_HOST}" \
            "whoami"

      - name: Deploy website
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -eu

          tar -C myportfolio -czf portfolio.tar.gz .

          cat portfolio.tar.gz | ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${VM_USER}@${VM_HOST}" \
            'set -eu
             sudo mkdir -p /var/www/html
             sudo tar -xzf - -C /var/www/html
             sudo chown -R www-data:www-data /var/www/html
             sudo nginx -t
             sudo systemctl reload nginx'

      - name: Verify deployed website
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -eu
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 2 \
            "http://${VM_HOST}/" \
            -o /dev/null
          echo "Portfolio website responds successfully"

          echo "=================================="
          echo "PORTFOLIO DEPLOYMENT SUCCESSFUL"
          echo "=================================="
          echo "Azure VM deployment completed."
